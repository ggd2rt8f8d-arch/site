<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-card .icon {
            font-size: 64px;
            color: #0088cc;
            margin-bottom: 20px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .success-msg {
            color: #88dd88;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .footer-text {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 30px;
        }
        .telegram-widget-container {
            margin: 10px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .telegram-widget-container iframe {
            border-radius: 50px !important;
        }
        .loading-text {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #0088cc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-box {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 12px;
            display: none;
        }
        .error-box.show {
            display: block;
        }
        .error-box .text {
            color: #ff6b6b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>
        <h1>Movie Admin</h1>
        <p>Войдите через Telegram, чтобы управлять фильмами</p>

        <!-- ВСТРОЕННЫЙ ВИДЖЕТ TELEGRAM -->
        <div class="telegram-widget-container" id="telegramWidget">
            <div class="loading-text">
                <span class="spinner"></span> Загрузка виджета...
            </div>
        </div>

        <div id="errorBox" class="error-box">
            <div class="text" id="errorText">
                <i class="fas fa-exclamation-circle"></i> Ошибка авторизации
            </div>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> <span id="successText">Авторизация успешна! Перенаправление...</span>
        </div>

        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Безопасный вход через Telegram
        </div>
    </div>

    <script>
        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        const BOT_TOKEN = '{{ BOT_TOKEN }}';
        const BOT_ID = '{{ BOT_ID }}';
        
        let botId = BOT_ID && BOT_ID !== 'None' ? BOT_ID : null;
        if (!botId && BOT_TOKEN && BOT_TOKEN !== 'None') {
            botId = BOT_TOKEN.split(':')[0];
        }
        
        console.log('🔑 Bot ID:', botId);
        console.log('🌐 Origin:', window.location.origin);
        console.log('📝 BOT_TOKEN:', BOT_TOKEN ? '✅ установлен' : '❌ не установлен');

        // ============================================================
        // ГЛОБАЛЬНАЯ ФУНКЦИЯ — её вызывает Telegram Widget
        // ============================================================
        window.onTelegramAuth = function(user) {
            console.log('✅ Авторизация через Telegram:', user);
            
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('successText').textContent = 'Авторизация успешна! Перенаправление...';
            document.getElementById('errorBox').classList.remove('show');
            document.getElementById('telegramWidget').innerHTML = '<div class="loading-text"><span class="spinner"></span> Вход...</div>';
            
            fetch('/auth/telegram', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    id: user.id,
                    first_name: user.first_name || '',
                    last_name: user.last_name || '',
                    username: user.username || '',
                    photo_url: user.photo_url || '',
                    auth_date: user.auth_date,
                    hash: user.hash
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || 'Ошибка сервера'); });
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('errorBox').classList.add('show');
                    document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (data.error || 'Ошибка авторизации');
                    document.getElementById('successMsg').style.display = 'none';
                    document.getElementById('telegramWidget').innerHTML = '';
                    loadTelegramWidget();
                }
            })
            .catch((err) => {
                console.error('❌ Ошибка:', err);
                document.getElementById('errorBox').classList.add('show');
                document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (err.message || 'Ошибка соединения с сервером');
                document.getElementById('successMsg').style.display = 'none';
                document.getElementById('telegramWidget').innerHTML = '';
                loadTelegramWidget();
            });
        };

        // ============================================================
        // ЗАГРУЗКА ВСТРОЕННОГО ВИДЖЕТА
        // ============================================================
        function loadTelegramWidget() {
            const container = document.getElementById('telegramWidget');
            
            if (!botId || botId === 'None' || botId === '') {
                container.innerHTML = `
                    <div style="color:rgba(255,255,255,0.5);font-size:14px;padding:20px;">
                        <i class="fas fa-exclamation-triangle"></i> BOT_ID не настроен
                    </div>
                `;
                return;
            }

            console.log('📡 Загрузка встроенного виджета...');

            // Создаём скрипт виджета
            const script = document.createElement('script');
            script.src = 'https://telegram.org/js/telegram-widget.js?22';
            script.setAttribute('data-telegram-login', botId);
            script.setAttribute('data-size', 'large');
            script.setAttribute('data-radius', '50');
            script.setAttribute('data-request-access', 'write');
            script.setAttribute('data-onauth', 'onTelegramAuth(user)');
            script.setAttribute('data-userpic', 'true');
            script.async = true;
            
            script.onerror = function() {
                console.error('❌ Ошибка загрузки виджета');
                container.innerHTML = `
                    <div style="color:rgba(255,255,255,0.5);font-size:14px;padding:10px;">
                        <i class="fas fa-exclamation-triangle"></i> Не удалось загрузить виджет
                        <br>
                        <button class="btn btn-outline-light mt-2" onclick="location.reload()" style="border-radius:50px;padding:8px 24px;font-size:14px;">
                            <i class="fas fa-sync"></i> Обновить
                        </button>
                    </div>
                `;
            };
            
            container.innerHTML = '';
            container.appendChild(script);
            
            // Таймаут на случай, если виджет не загрузился
            setTimeout(() => {
                if (container.querySelector('iframe') === null) {
                    console.warn('⚠️ Виджет не загрузился за 5 секунд');
                    container.innerHTML = `
                        <div style="color:rgba(255,255,255,0.5);font-size:14px;padding:10px;">
                            <i class="fas fa-exclamation-triangle"></i> Виджет не загрузился
                            <br>
                            <button class="btn btn-outline-light mt-2" onclick="location.reload()" style="border-radius:50px;padding:8px 24px;font-size:14px;">
                                <i class="fas fa-sync"></i> Обновить
                            </button>
                        </div>
                    `;
                }
            }, 5000);
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем, может уже авторизован
            fetch('/api/check-auth', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.href = '/dashboard';
                    }
                })
                .catch(() => {});
            
            // Загружаем виджет
            setTimeout(loadTelegramWidget, 500);
        });
    </script>
</body>
</html>
