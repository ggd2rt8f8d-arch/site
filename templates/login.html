<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Movie Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-card .icon {
            font-size: 56px;
            color: #0088cc;
            margin-bottom: 12px;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0088cc;
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn-primary {
            background: #0088cc;
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-primary:hover {
            background: #006699;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,136,204,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 10px 30px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            background: rgba(220,53,69,0.1);
            border: 1px solid rgba(220,53,69,0.2);
            border-radius: 10px;
            padding: 12px 16px;
        }
        .success-msg {
            color: #88dd88;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            background: rgba(40,167,69,0.1);
            border: 1px solid rgba(40,167,69,0.2);
            border-radius: 10px;
            padding: 12px 16px;
        }
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 20px 0;
        }
        .or-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            margin: 16px 0;
        }
        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }
        .footer-text {
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            margin-top: 16px;
        }
        .link-text {
            color: #0088cc;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .link-text:hover {
            color: #33aadd;
            text-decoration: underline;
        }
        .google-btn-wrapper {
            margin: 8px 0;
        }
        .google-btn-wrapper .gsi-material-button {
            width: 100% !important;
            max-width: 100% !important;
            justify-content: center !important;
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 50px !important;
            padding: 10px !important;
        }
        .google-btn-wrapper .gsi-material-button:hover {
            background: rgba(255,255,255,0.15) !important;
        }
        .loading {
            display: none;
        }
        .loading.show {
            display: inline-block;
        }
        .movie-id-hint {
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            margin-top: 4px;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-card h1 {
                font-size: 24px;
            }
            .login-card .icon {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>
        <h1>Movie Admin</h1>
        <p class="subtitle">Войдите в свой аккаунт</p>

        <div id="errorMsg" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Ошибка</span>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> <span id="successText">Успешно!</span>
        </div>

        <!-- Форма входа -->
        <form id="loginForm" onsubmit="return login(event)">
            <div class="mb-3">
                <input type="text" class="form-control" id="loginInput" placeholder="Email или юзернейм" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="passwordInput" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <span class="loading" id="loginLoading"><i class="fas fa-spinner fa-spin"></i></span>
                <span id="loginText"><i class="fas fa-sign-in-alt"></i> Войти</span>
            </button>
        </form>

        <div class="mt-3" style="color: rgba(255,255,255,0.3); font-size: 13px;">
            <a href="#" onclick="showRegister()" class="link-text">Создать аккаунт</a>
        </div>

        <div class="or-divider">или</div>

        <!-- Google Login -->
        <div class="google-btn-wrapper" id="googleButtonContainer"></div>

        <hr class="divider">

        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Безопасный вход
        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = "{{ GOOGLE_CLIENT_ID }}";

        function showError(msg) {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorText').textContent = msg;
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('successText').textContent = msg;
            document.getElementById('errorMsg').style.display = 'none';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            const loadingEl = btn.querySelector('.loading');
            const textEl = btn.querySelector('span:not(.loading)');
            if (loading) {
                loadingEl.classList.add('show');
                if (textEl) textEl.style.display = 'none';
                btn.disabled = true;
            } else {
                loadingEl.classList.remove('show');
                if (textEl) textEl.style.display = 'inline';
                btn.disabled = false;
            }
        }

        async function login(e) {
            e.preventDefault();
            const email_or_username = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!email_or_username || !password) {
                showError('Заполните все поля');
                return;
            }

            setLoading('loginBtn', true);
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email_or_username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showSuccess('✅ Вход выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(data.detail || 'Ошибка входа');
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
                console.error(err);
            } finally {
                setLoading('loginBtn', false);
            }
        }

        function showRegister() {
            window.location.href = '/register';
        }

        // Google Login
        function initGoogleLogin() {
            if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID === "" || GOOGLE_CLIENT_ID === "{{ GOOGLE_CLIENT_ID }}") {
                console.warn("Google Client ID не задан");
                return;
            }

            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    cancel_on_tap_outside: false,
                    context: 'signin',
                    ux_mode: 'popup'
                });

                google.accounts.id.renderButton(
                    document.getElementById('googleButtonContainer'),
                    { 
                        theme: 'outline',
                        size: 'large',
                        type: 'standard',
                        shape: 'pill',
                        logo_alignment: 'center',
                        text: 'signin_with',
                        width: '100%'
                    }
                );
            } catch(e) {
                console.error('Google init error:', e);
            }
        }

        async function handleGoogleCredentialResponse(response) {
            try {
                const payload = parseJwt(response.credential);
                if (!payload) {
                    showError('Не удалось получить данные от Google');
                    return;
                }

                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: payload.email,
                        name: payload.name,
                        picture: payload.picture
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showSuccess('✅ Вход через Google выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(data.detail || 'Ошибка входа через Google');
                }
            } catch (err) {
                console.error('Google auth error:', err);
                showError('Ошибка соединения с сервером');
            }
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error('JWT parse error:', e);
                return null;
            }
        }

        // Enter для входа
        document.getElementById('passwordInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login(e);
        });
        document.getElementById('loginInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initGoogleLogin, 500);
        });
    </script>
</body>
</html>
