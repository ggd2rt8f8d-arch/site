<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-card .icon {
            font-size: 64px;
            color: #0088cc;
            margin-bottom: 20px;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0088cc;
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .btn-primary {
            background: #0088cc;
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-primary:hover {
            background: #006699;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,136,204,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 10px 30px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .success-msg {
            color: #88dd88;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .footer-text {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 30px;
        }
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 25px 0;
        }
        .label {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-bottom: 8px;
            display: block;
            text-align: left;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .info-text {
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            margin-top: 12px;
        }
        .user-preview {
            display: none;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            align-items: center;
            gap: 15px;
        }
        .user-preview.show {
            display: flex;
        }
        .user-preview .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0088cc;
        }
        .user-preview .info {
            text-align: left;
            flex: 1;
        }
        .user-preview .info .name {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
        }
        .user-preview .info .username {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }
        .loading {
            display: none;
        }
        .loading.show {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>
        <h1>Movie Admin</h1>
        <p>Войдите в админ-панель</p>

        <!-- ШАГ 1: Ввод ID -->
        <div class="step active" id="step1">
            <label class="label"><i class="fas fa-id-badge"></i> Ваш Telegram ID</label>
            <input type="number" class="form-control" id="userIdInput" placeholder="Например: 123456789">
            <button class="btn-primary mt-3" onclick="requestCode()" id="requestBtn">
                <span class="loading" id="requestLoading"><i class="fas fa-spinner fa-spin"></i></span>
                <span id="requestText"><i class="fas fa-paper-plane"></i> Получить код</span>
            </button>
            <div class="info-text">
                Код будет отправлен в Telegram
            </div>
        </div>

        <!-- ШАГ 2: Ввод кода -->
        <div class="step" id="step2">
            <label class="label"><i class="fas fa-key"></i> Код подтверждения</label>
            <input type="text" class="form-control" id="codeInput" placeholder="Введите 6-значный код" maxlength="6">
            <button class="btn-primary mt-3" onclick="verifyCode()" id="verifyBtn">
                <span class="loading" id="verifyLoading"><i class="fas fa-spinner fa-spin"></i></span>
                <span id="verifyText"><i class="fas fa-sign-in-alt"></i> Войти</span>
            </button>
            <button class="btn-secondary mt-2" onclick="backToStep1()">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
            <div class="info-text">
                Код отправлен в Telegram. Проверьте чат с ботом.
            </div>
        </div>

        <!-- Превью пользователя -->
        <div class="user-preview" id="userPreview">
            <img class="avatar" id="previewAvatar" src="" alt="Avatar">
            <div class="info">
                <div class="name" id="previewName">Имя</div>
                <div class="username" id="previewUsername">@username</div>
            </div>
        </div>

        <div id="errorMsg" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Ошибка</span>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> <span id="successText">Успешно! Перенаправление...</span>
        </div>

        <hr class="divider">

        <div style="color:rgba(255,255,255,0.2); font-size:12px;">
            <i class="fas fa-shield-alt"></i> Безопасный вход с подтверждением
        </div>
    </div>

    <script>
        // ============================================================
        // Вход по коду с получением данных из Telegram
        // ============================================================
        
        const ADMIN_ID = 2113363430;

        function showStep(step) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(step).classList.add('active');
        }

        function backToStep1() {
            showStep('step1');
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('userPreview').classList.remove('show');
        }

        function showError(msg) {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorText').textContent = msg;
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('successText').textContent = msg;
            document.getElementById('errorMsg').style.display = 'none';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            const loadingEl = btn.querySelector('.loading');
            const textEl = btn.querySelector('span:not(.loading)');
            if (loading) {
                loadingEl.classList.add('show');
                textEl.style.display = 'none';
                btn.disabled = true;
            } else {
                loadingEl.classList.remove('show');
                textEl.style.display = 'inline';
                btn.disabled = false;
            }
        }

        async function getUserData(userId) {
            try {
                const response = await fetch(`/api/user/${userId}/name`);
                if (response.ok) {
                    const data = await response.json();
                    return data;
                }
                return null;
            } catch {
                return null;
            }
        }

        async function requestCode() {
            const userId = parseInt(document.getElementById('userIdInput').value);
            
            if (!userId) {
                showError('Введите ваш Telegram ID');
                return;
            }

            setLoading('requestBtn', true);
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const formData = new URLSearchParams({ user_id: userId });
                const response = await fetch('/auth/request-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Показываем превью пользователя (если есть в БД)
                    const userData = await getUserData(userId);
                    if (userData && userData.name) {
                        const preview = document.getElementById('userPreview');
                        document.getElementById('previewName').textContent = userData.name;
                        document.getElementById('previewUsername').textContent = userId;
                        if (userData.photo_url) {
                            document.getElementById('previewAvatar').src = userData.photo_url;
                        }
                        preview.classList.add('show');
                    }
                    
                    showStep('step2');
                    document.getElementById('errorMsg').style.display = 'none';
                    showSuccess('✅ Код отправлен! Проверьте Telegram');
                    document.getElementById('codeInput').value = '';
                    document.getElementById('codeInput').focus();
                } else {
                    showError(data.error || 'Ошибка отправки кода');
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
                console.error(err);
            } finally {
                setLoading('requestBtn', false);
            }
        }

        async function verifyCode() {
            const userId = parseInt(document.getElementById('userIdInput').value);
            const code = document.getElementById('codeInput').value.trim();

            if (!code || code.length < 6) {
                showError('Введите 6-значный код');
                return;
            }

            setLoading('verifyBtn', true);
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const formData = new URLSearchParams({ user_id: userId, code: code });
                const response = await fetch('/auth/verify-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ Вход выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(data.error || 'Неверный код');
                    document.getElementById('codeInput').value = '';
                    document.getElementById('codeInput').focus();
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
                console.error(err);
            } finally {
                setLoading('verifyBtn', false);
            }
        }

        // Enter для быстрого ввода
        document.getElementById('userIdInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') requestCode();
        });
        document.getElementById('codeInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCode();
        });

        // Автофокус на поле кода при переходе на шаг 2
        const observer = new MutationObserver(() => {
            if (document.getElementById('step2').classList.contains('active')) {
                setTimeout(() => document.getElementById('codeInput').focus(), 300);
            }
        });
        observer.observe(document.getElementById('step2'), { attributes: true, attributeFilter: ['class'] });

        // Устанавливаем ID админа по умолчанию
        document.getElementById('userIdInput').value = ADMIN_ID;
    </script>
</body>
</html>
