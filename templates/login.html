<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-card .icon {
            font-size: 64px;
            color: #0088cc;
            margin-bottom: 20px;
        }
        .telegram-btn {
            background: #0088cc;
            border: none;
            border-radius: 50px;
            padding: 14px 40px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            width: 100%;
            justify-content: center;
        }
        .telegram-btn:hover {
            background: #006699;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,136,204,0.3);
            color: #fff;
        }
        .telegram-btn i {
            font-size: 24px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .footer-text {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 30px;
        }
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 25px 0;
        }
        .id-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }
        .id-input:focus {
            outline: none;
            border-color: #0088cc;
            background: rgba(255,255,255,0.12);
        }
        .id-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .btn-outline-light {
            border-radius: 50px;
            padding: 10px 30px;
            width: 100%;
            border-color: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            transition: all 0.3s;
        }
        .btn-outline-light:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .id-label {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-bottom: 8px;
            display: block;
            text-align: left;
        }
        .success-msg {
            color: #88dd88;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .telegram-widget-container {
            margin: 10px 0;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>
        <h1>Movie Admin</h1>
        <p>Войдите, чтобы управлять фильмами</p>

        <!-- ВСТРОЕННЫЙ ВИДЖЕТ TELEGRAM -->
        <div class="telegram-widget-container" id="telegramWidget"></div>

        <hr class="divider">

        <!-- Запасной вход по ID -->
        <form method="post" action="/auth/id">
            <label class="id-label"><i class="fas fa-key"></i> Или введите Telegram ID</label>
            <input type="number" name="user_id" placeholder="Например: 123456789" class="id-input" required>
            <button type="submit" class="btn btn-outline-light mt-3">
                <i class="fas fa-sign-in-alt"></i> Войти по ID
            </button>
        </form>

        <div id="errorMsg" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Ошибка авторизации</span>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> <span id="successText">Авторизация успешна! Перенаправление...</span>
        </div>

        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Безопасный вход
        </div>
    </div>

    <script>
        // ============================================================
        // ГЛОБАЛЬНАЯ ФУНКЦИЯ — её вызывает Telegram Widget
        // ============================================================
        window.onTelegramAuth = function(user) {
            console.log('✅ Авторизация через Telegram:', user);
            
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('successText').textContent = 'Авторизация успешна! Перенаправление...';
            
            // Отправляем данные на сервер
            fetch('/auth/telegram', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    id: user.id,
                    first_name: user.first_name || '',
                    last_name: user.last_name || '',
                    username: user.username || '',
                    photo_url: user.photo_url || '',
                    auth_date: user.auth_date,
                    hash: user.hash
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || 'Ошибка сервера'); });
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    document.getElementById('errorText').textContent = data.error || 'Ошибка авторизации';
                    document.getElementById('successMsg').style.display = 'none';
                }
            })
            .catch((err) => {
                console.error('❌ Ошибка:', err);
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorText').textContent = err.message || 'Ошибка соединения с сервером';
                document.getElementById('successMsg').style.display = 'none';
            });
        };

        // ============================================================
        // ЗАГРУЗКА ВИДЖЕТА
        // ============================================================
        function loadTelegramWidget() {
            const container = document.getElementById('telegramWidget');
            const botToken = '{{ BOT_TOKEN }}';
            const botId = botToken ? botToken.split(':')[0] : '';
            
            if (!botId) {
                container.innerHTML = '<p style="color:rgba(255,255,255,0.5);font-size:14px;">⚠️ BOT_TOKEN не настроен</p>';
                return;
            }

            // Создаём скрипт виджета
            const script = document.createElement('script');
            script.src = 'https://telegram.org/js/telegram-widget.js?22';
            script.setAttribute('data-telegram-login', botId);
            script.setAttribute('data-size', 'large');
            script.setAttribute('data-radius', '50');
            script.setAttribute('data-request-access', 'write');
            script.setAttribute('data-onauth', 'onTelegramAuth(user)');
            script.setAttribute('data-userpic', 'true');
            script.async = true;
            
            script.onerror = function() {
                container.innerHTML = `
                    <button class="telegram-btn" onclick="redirectToTelegram()">
                        <i class="fab fa-telegram"></i> Войти через Telegram
                    </button>
                `;
            };
            
            container.appendChild(script);
            console.log('🔑 Bot ID:', botId);
            console.log('🌐 Origin:', window.location.origin);
            console.log('✅ Виджет загружается...');
        }

        // Запасной способ — открыть окно OAuth
        function redirectToTelegram() {
            const botToken = '{{ BOT_TOKEN }}';
            const botId = botToken ? botToken.split(':')[0] : '';
            
            if (!botId) {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorText').textContent = 'BOT_TOKEN не настроен!';
                return;
            }
            
            const origin = encodeURIComponent(window.location.origin);
            const authUrl = `https://oauth.telegram.org/auth?bot_id=${botId}&origin=${origin}&embed=1&request_access=write`;
            
            const win = window.open(authUrl, '_blank', 'width=600,height=700,scrollbars=yes');
            
            const checkWin = setInterval(() => {
                if (win.closed) {
                    clearInterval(checkWin);
                    setTimeout(checkAuth, 1000);
                }
            }, 500);
        }

        function checkAuth() {
            fetch('/api/check-auth', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.href = '/dashboard';
                    }
                })
                .catch(() => {});
        }

        // Загружаем виджет при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadTelegramWidget);
    </script>
</body>
</html>
