<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 6px;
        }
        .login-card .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-card .icon {
            font-size: 56px;
            color: #0088cc;
            margin-bottom: 16px;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0088cc;
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .btn-primary {
            background: #0088cc;
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-primary:hover {
            background: #006699;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,136,204,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 10px 30px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .success-msg {
            color: #88dd88;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 20px 0;
        }
        .label {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-bottom: 6px;
            display: block;
            text-align: left;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .info-text {
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            margin-top: 10px;
        }
        .user-preview {
            display: none;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            align-items: center;
            gap: 15px;
        }
        .user-preview.show {
            display: flex;
        }
        .user-preview .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0088cc;
        }
        .user-preview .info {
            text-align: left;
            flex: 1;
        }
        .user-preview .info .name {
            color: #fff;
            font-weight: 600;
            font-size: 15px;
        }
        .user-preview .info .username {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
        }
        .loading {
            display: none;
        }
        .loading.show {
            display: inline-block;
        }
        .google-btn-wrapper {
            margin: 8px 0;
        }
        .google-btn-wrapper .gsi-material-button {
            width: 100% !important;
            max-width: 100% !important;
            justify-content: center !important;
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 50px !important;
            padding: 10px !important;
        }
        .google-btn-wrapper .gsi-material-button:hover {
            background: rgba(255,255,255,0.15) !important;
        }
        .or-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            margin: 16px 0;
        }
        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }
        .footer-text {
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            margin-top: 20px;
        }
        .back-link {
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            background: none;
            border: none;
            padding: 8px 0;
        }
        .back-link:hover {
            color: #fff;
        }
        .telegram-login-hint {
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            margin-top: 8px;
        }
        .telegram-login-hint i {
            color: #0088cc;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-card h1 {
                font-size: 24px;
            }
            .login-card .icon {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>
        <h1>Movie Admin</h1>
        <p class="subtitle">Войдите в админ-панель</p>

        <!-- ШАГ 1: Ввод ID -->
        <div class="step active" id="step1">
            <label class="label"><i class="fas fa-id-badge"></i> Ваш Telegram ID</label>
            <input type="number" class="form-control" id="userIdInput" placeholder="Например: 123456789">
            <button class="btn-primary mt-3" onclick="requestCode()" id="requestBtn">
                <span class="loading" id="requestLoading"><i class="fas fa-spinner fa-spin"></i></span>
                <span id="requestText"><i class="fas fa-paper-plane"></i> Получить код</span>
            </button>
            <div class="info-text">
                Код будет отправлен в Telegram
            </div>

            <div class="or-divider">или</div>

            <!-- Google Login -->
            <div class="google-btn-wrapper" id="googleButtonContainer">
                <!-- Google кнопка будет вставлена сюда -->
            </div>

            <div class="telegram-login-hint">
                <i class="fab fa-telegram"></i> Вход через Telegram ID
            </div>
        </div>

        <!-- ШАГ 2: Ввод кода -->
        <div class="step" id="step2">
            <label class="label"><i class="fas fa-key"></i> Код подтверждения</label>
            <input type="text" class="form-control" id="codeInput" placeholder="Введите 6-значный код" maxlength="6">
            <button class="btn-primary mt-3" onclick="verifyCode()" id="verifyBtn">
                <span class="loading" id="verifyLoading"><i class="fas fa-spinner fa-spin"></i></span>
                <span id="verifyText"><i class="fas fa-sign-in-alt"></i> Войти</span>
            </button>
            <button class="back-link mt-2" onclick="backToStep1()">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
            <div class="info-text">
                Код отправлен в Telegram. Проверьте чат с ботом.
            </div>
        </div>

        <!-- Превью пользователя -->
        <div class="user-preview" id="userPreview">
            <img class="avatar" id="previewAvatar" src="" alt="Avatar">
            <div class="info">
                <div class="name" id="previewName">Имя</div>
                <div class="username" id="previewUsername">@username</div>
            </div>
        </div>

        <div id="errorMsg" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Ошибка</span>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> <span id="successText">Успешно! Перенаправление...</span>
        </div>

        <hr class="divider">

        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Безопасный вход с подтверждением
        </div>
    </div>

    <script>
        // ============================================================
        // Google OAuth 2.0 Login
        // ============================================================
        
        const GOOGLE_CLIENT_ID = "{{ GOOGLE_CLIENT_ID }}";

        function initGoogleLogin() {
            if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID === "") {
                console.warn("Google Client ID не задан");
                return;
            }

            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    cancel_on_tap_outside: false,
                    context: 'signin',
                    ux_mode: 'popup'
                });

                google.accounts.id.renderButton(
                    document.getElementById('googleButtonContainer'),
                    { 
                        theme: 'outline',
                        size: 'large',
                        type: 'standard',
                        shape: 'pill',
                        logo_alignment: 'center',
                        text: 'signin_with',
                        width: '100%'
                    }
                );
            } catch(e) {
                console.error('Google init error:', e);
            }
        }

        async function handleGoogleCredentialResponse(response) {
            try {
                // Декодируем JWT для получения данных пользователя
                const payload = parseJwt(response.credential);
                
                if (!payload) {
                    showError('Не удалось получить данные от Google');
                    return;
                }

                const email = payload.email;
                const name = payload.name;
                const picture = payload.picture;

                if (!email) {
                    showError('Email не получен от Google');
                    return;
                }

                // Отправляем данные на сервер
                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, name, picture })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showSuccess('✅ Вход через Google выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(data.detail || 'Ошибка входа через Google');
                }
            } catch (err) {
                console.error('Google auth error:', err);
                showError('Ошибка соединения с сервером');
            }
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error('JWT parse error:', e);
                return null;
            }
        }

        // ============================================================
        // Telegram Login
        // ============================================================
        
        const ADMIN_ID = 2113363430;

        function showStep(step) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(step).classList.add('active');
        }

        function backToStep1() {
            showStep('step1');
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('userPreview').classList.remove('show');
        }

        function showError(msg) {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorText').textContent = msg;
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('successText').textContent = msg;
            document.getElementById('errorMsg').style.display = 'none';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const loadingEl = btn.querySelector('.loading');
            const textEl = btn.querySelector('span:not(.loading)');
            if (loading) {
                loadingEl.classList.add('show');
                if (textEl) textEl.style.display = 'none';
                btn.disabled = true;
            } else {
                loadingEl.classList.remove('show');
                if (textEl) textEl.style.display = 'inline';
                btn.disabled = false;
            }
        }

        async function getUserData(userId) {
            try {
                const response = await fetch(`/api/user/${userId}/name`);
                if (response.ok) {
                    const data = await response.json();
                    return data;
                }
                return null;
            } catch {
                return null;
            }
        }

        async function requestCode() {
            const userId = parseInt(document.getElementById('userIdInput').value);
            
            if (!userId) {
                showError('Введите ваш Telegram ID');
                return;
            }

            setLoading('requestBtn', true);
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const formData = new URLSearchParams({ user_id: userId });
                const response = await fetch('/auth/request-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    const userData = await getUserData(userId);
                    if (userData && userData.display_name) {
                        const preview = document.getElementById('userPreview');
                        document.getElementById('previewName').textContent = userData.display_name || 'Пользователь';
                        document.getElementById('previewUsername').textContent = userId;
                        if (userData.photo_url) {
                            document.getElementById('previewAvatar').src = userData.photo_url;
                        }
                        preview.classList.add('show');
                    }
                    
                    showStep('step2');
                    document.getElementById('errorMsg').style.display = 'none';
                    showSuccess('✅ Код отправлен! Проверьте Telegram');
                    document.getElementById('codeInput').value = '';
                    document.getElementById('codeInput').focus();
                } else {
                    showError(data.error || 'Ошибка отправки кода');
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
                console.error(err);
            } finally {
                setLoading('requestBtn', false);
            }
        }

        async function verifyCode() {
            const userId = parseInt(document.getElementById('userIdInput').value);
            const code = document.getElementById('codeInput').value.trim();

            if (!code || code.length < 6) {
                showError('Введите 6-значный код');
                return;
            }

            setLoading('verifyBtn', true);
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const formData = new URLSearchParams({ user_id: userId, code: code });
                const response = await fetch('/auth/verify-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccess('✅ Вход выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(data.error || 'Неверный код');
                    document.getElementById('codeInput').value = '';
                    document.getElementById('codeInput').focus();
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
                console.error(err);
            } finally {
                setLoading('verifyBtn', false);
            }
        }

        // Enter для быстрого ввода
        document.getElementById('userIdInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') requestCode();
        });
        document.getElementById('codeInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCode();
        });

        // Автофокус на поле кода при переходе на шаг 2
        const observer = new MutationObserver(() => {
            if (document.getElementById('step2').classList.contains('active')) {
                setTimeout(() => document.getElementById('codeInput').focus(), 300);
            }
        });
        observer.observe(document.getElementById('step2'), { attributes: true, attributeFilter: ['class'] });

        // Устанавливаем ID админа по умолчанию
        document.getElementById('userIdInput').value = ADMIN_ID;

        // Инициализируем Google Login после загрузки страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Небольшая задержка для загрузки Google SDK
            setTimeout(initGoogleLogin, 500);
        });
    </script>
</body>
</html>
