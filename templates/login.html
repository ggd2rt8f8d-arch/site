<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-card .icon {
            font-size: 64px;
            color: #0088cc;
            margin-bottom: 20px;
        }
        .btn-telegram {
            background: #0088cc;
            border: none;
            border-radius: 50px;
            padding: 14px 40px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            width: 100%;
            justify-content: center;
        }
        .btn-telegram:hover {
            background: #006699;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,136,204,0.3);
            color: #fff;
        }
        .btn-telegram i {
            font-size: 24px;
        }
        .error-box {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 12px;
            display: none;
        }
        .error-box.show {
            display: block;
        }
        .error-box .text {
            color: #ff6b6b;
            font-size: 13px;
        }
        .success-msg {
            color: #88dd88;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .footer-text {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 30px;
        }
        .info-text {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 8px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #0088cc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .debug-info {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            text-align: left;
            display: none;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <i class="fas fa-film"></i>
        </div>
        <h1>Movie Admin</h1>
        <p>Войдите через Telegram, чтобы управлять фильмами</p>

        <button class="btn-telegram" onclick="redirectToTelegram()">
            <i class="fab fa-telegram"></i> Войти через Telegram
        </button>

        <div class="info-text">
            Нажмите кнопку, авторизуйтесь в Telegram и вернитесь на сайт
        </div>

        <div id="errorBox" class="error-box">
            <div class="text" id="errorText">
                <i class="fas fa-exclamation-circle"></i> Ошибка авторизации
            </div>
        </div>

        <div id="successMsg" class="success-msg">
            <i class="fas fa-check-circle"></i> <span id="successText">Авторизация успешна! Перенаправление...</span>
        </div>

        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Безопасный вход через Telegram
        </div>

        <div class="debug-info" id="debugInfo">
            <div id="debugContent">Ожидание...</div>
        </div>
    </div>

    <script>
        // ============================================================
        // ПЕРЕМЕННЫЕ
        // ============================================================
        const BOT_TOKEN = '{{ BOT_TOKEN }}';
        const BOT_ID = '{{ BOT_ID }}';
        
        let botId = BOT_ID && BOT_ID !== 'None' ? BOT_ID : null;
        if (!botId && BOT_TOKEN && BOT_TOKEN !== 'None') {
            botId = BOT_TOKEN.split(':')[0];
        }
        
        console.log('🔑 Bot ID:', botId);
        console.log('🌐 Origin:', window.location.origin);
        console.log('📝 BOT_TOKEN:', BOT_TOKEN ? '✅ установлен' : '❌ не установлен');

        // Отладка
        const debugInfo = document.getElementById('debugInfo');
        const debugContent = document.getElementById('debugContent');
        
        function logDebug(msg) {
            debugInfo.style.display = 'block';
            debugContent.innerHTML += msg + '<br>';
            console.log('🐛', msg);
        }

        logDebug('Bot ID: ' + botId);
        logDebug('Origin: ' + window.location.origin);

        // ============================================================
        // ГЛОБАЛЬНАЯ ФУНКЦИЯ — её вызывает Telegram Widget
        // ============================================================
        window.onTelegramAuth = function(user) {
            logDebug('✅ onTelegramAuth вызван!');
            logDebug('User ID: ' + user.id);
            logDebug('Username: ' + (user.username || 'нет'));
            logDebug('Hash: ' + user.hash.substring(0, 20) + '...');
            
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('successText').textContent = 'Авторизация успешна! Перенаправление...';
            document.getElementById('errorBox').classList.remove('show');
            
            const payload = new URLSearchParams({
                id: user.id,
                first_name: user.first_name || '',
                last_name: user.last_name || '',
                username: user.username || '',
                photo_url: user.photo_url || '',
                auth_date: user.auth_date,
                hash: user.hash
            });
            
            logDebug('📤 Отправка данных на сервер...');
            
            fetch('/auth/telegram', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: payload
            })
            .then(response => {
                logDebug('📥 Ответ сервера: ' + response.status);
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || 'Ошибка сервера'); });
                }
                return response.json();
            })
            .then(data => {
                logDebug('📦 Данные: ' + JSON.stringify(data));
                if (data.success) {
                    logDebug('✅ Перенаправление на /dashboard');
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('errorBox').classList.add('show');
                    document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (data.error || 'Ошибка авторизации');
                    document.getElementById('successMsg').style.display = 'none';
                    logDebug('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            })
            .catch((err) => {
                logDebug('❌ Исключение: ' + err.message);
                document.getElementById('errorBox').classList.add('show');
                document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (err.message || 'Ошибка соединения с сервером');
                document.getElementById('successMsg').style.display = 'none';
            });
        };

        // ============================================================
        // ВХОД ЧЕРЕЗ OAuth
        // ============================================================
        function redirectToTelegram() {
            if (!botId) {
                document.getElementById('errorBox').classList.add('show');
                document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> BOT_ID не настроен!';
                return;
            }
            
            const origin = encodeURIComponent(window.location.origin);
            const authUrl = `https://oauth.telegram.org/auth?bot_id=${botId}&origin=${origin}&embed=1&request_access=write`;
            
            logDebug('🔗 Открываем окно: ' + authUrl);
            
            const win = window.open(authUrl, '_blank', 'width=600,height=700,scrollbars=yes');
            
            if (!win) {
                document.getElementById('errorBox').classList.add('show');
                document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> Браузер заблокировал всплывающее окно. Разрешите всплывающие окна для этого сайта.';
                return;
            }
            
            const checkWin = setInterval(() => {
                if (win.closed) {
                    clearInterval(checkWin);
                    logDebug('🚪 Окно закрыто, проверяем авторизацию...');
                    setTimeout(checkAuth, 1500);
                }
            }, 500);
        }

        function checkAuth() {
            logDebug('🔍 Проверка авторизации...');
            fetch('/api/check-auth', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    logDebug('📊 check-auth ответ: ' + JSON.stringify(data));
                    if (data.authenticated) {
                        logDebug('✅ Авторизован! Перенаправление...');
                        window.location.href = '/dashboard';
                    } else {
                        logDebug('❌ Не авторизован');
                        document.getElementById('errorBox').classList.add('show');
                        document.getElementById('errorText').innerHTML = '<i class="fas fa-exclamation-circle"></i> Авторизация не выполнена. Попробуйте снова.';
                    }
                })
                .catch((err) => {
                    logDebug('❌ Ошибка check-auth: ' + err.message);
                });
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            logDebug('✅ Страница загружена');
            
            // Проверяем, может уже авторизован
            fetch('/api/check-auth', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        logDebug('✅ Уже авторизован! Перенаправление...');
                        window.location.href = '/dashboard';
                    }
                })
                .catch(() => {});
        });
    </script>
</body>
</html>
